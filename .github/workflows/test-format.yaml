name: test-format

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      # The versions the repository was formatted with.
      - name: Install formatters
        run: |
          curl -fsSL https://github.com/numtide/treefmt/releases/download/v2.5.0/treefmt_2.5.0_linux_amd64.tar.gz |
            sudo tar -C /usr/local/bin -xz treefmt
          curl -fsSL https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz |
            gunzip | sudo tee /usr/local/bin/taplo >/dev/null
          sudo chmod +x /usr/local/bin/taplo
          npm install -g prettier@3.9.6
          go install mvdan.cc/gofumpt@v0.11.0
          go install github.com/daixiang0/gci@v0.14.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0

      - name: Check formatting
        run: just fmt-check
