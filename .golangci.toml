version = '2'

[linters]
default = 'standard'
enable = [
  'copyloopvar',
  'errorlint',
  'gocritic',
  'misspell',
  'nolintlint',
  'predeclared',
  'revive',
  'unconvert',
  'usestdlibvars',
  'wastedassign',
]

# The quickfix suggestions (QF*) rewrite readable conditions for no gain.
[linters.settings.staticcheck]
checks = [
  'all',
  '-ST1000',
  '-ST1003',
  '-ST1016',
  '-ST1020',
  '-ST1021',
  '-ST1022',
  '-QF1001',
]

[linters.exclusions]
generated = 'lax'
presets = ['comments', 'common-false-positives', 'legacy', 'std-error-handling']

[formatters]
enable = ['gci', 'gofumpt']

# The module path has no dot, so gofumpt has to be told it is not the standard library.
[formatters.settings.gofumpt]
module-path = 'goodix5120'

# The same sections treefmt's gci uses.
[formatters.settings.gci]
sections = ['standard', 'default', 'localmodule']
